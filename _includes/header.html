<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="syn">SYN</span>copated Security</a>
    <nav aria-label="Main">
      <ul class="nav-list">
        <li><a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a></li>
        <li><a href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Projects</a></li>
        <li><a href="{{ '/talks/' | relative_url }}"{% if page.url contains '/talks' %} aria-current="page"{% endif %}>Talks</a></li>
        <li><a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a></li>
      </ul>
    </nav>
    <button type="button" class="volume" aria-pressed="false" aria-label="Full volume (dark mode)">
      <svg class="knob" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
        <circle class="knob-body" cx="16" cy="16" r="12"></circle>
        <line class="knob-pointer" x1="16" y1="16" x2="16" y2="7"></line>
      </svg>
      <span class="volume-label" aria-hidden="true">Unplugged</span>
    </button>
  </div>
</header>
